<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">PRISM: learned interactions for robot control</title>
  <desc id="desc">Existing proprioceptive observations are transformed into learned polynomial features. The representation feeds reinforcement learning policies for locomotion and imitation learning policies for manipulation. This is a conceptual diagram, not experimental data.</desc>
  <defs>
    <linearGradient id="prism-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3fe"/><stop offset="1" stop-color="#d3e3fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8c919b" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#202124}
      .label{font-size:18px;letter-spacing:2.2px;font-weight:700;fill:#5f6368}
      .body{font-size:23px;fill:#5f6368}
      .title{font-size:29px;font-weight:700}
      .accent{fill:#1967d2}
      .link{fill:none;stroke:#8c919b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="760" rx="28" fill="#f8fafd"/>
  <text x="64" y="84" font-size="44" font-weight="700">Learn the interactions that drive control.</text>
  <text x="65" y="128" class="body">A compact representation between robot observations and an existing policy.</text>

  <text x="66" y="195" class="label">01  OBSERVATIONS</text>
  <text x="565" y="195" class="label">02  LEARNED INTERACTIONS</text>
  <text x="1070" y="195" class="label">03  POLICY + ACTION</text>

  <rect x="64" y="228" width="410" height="390" rx="22" fill="#fff"/>
  <text x="97" y="275" class="title">Signals already available</text>
  <g transform="translate(99 326)">
    <rect width="338" height="72" rx="12" fill="#f1f3f4"/>
    <text x="18" y="44" font-size="23">Robot state</text>
    <text x="298" y="44" font-size="25" font-style="italic">xₜ</text>
    <rect y="97" width="338" height="72" rx="12" fill="#f1f3f4"/>
    <text x="18" y="141" font-size="23">Observation history</text>
    <text x="0" y="211" font-size="20" fill="#5f6368">State inputs depend on the backbone.</text>
  </g>
  <text x="99" y="580" class="body">No additional sensors</text>

  <path class="link" d="M491 423 H549" marker-end="url(#arrow)"/>
  <rect x="565" y="228" width="404" height="390" rx="22" fill="url(#prism-fill)"/>
  <text x="600" y="283" font-size="38" font-weight="700" class="accent">PRISM</text>
  <text x="600" y="323" class="body">Learnable polynomial features</text>
  <g transform="translate(606 361)">
    <rect x="0" y="0" width="91" height="86" rx="13" fill="#fff"/>
    <text x="45" y="56" text-anchor="middle" font-size="37" font-style="italic">u</text>
    <text x="128" y="56" text-anchor="middle" font-size="40" fill="#1967d2">⊙</text>
    <rect x="165" y="0" width="156" height="86" rx="13" fill="#fff"/>
    <text x="243" y="53" text-anchor="middle" font-size="25">1 + α ⊙ v</text>
    <text x="160" y="128" text-anchor="middle" font-size="21" fill="#185abc">Learned projections · learned gate</text>
  </g>
  <text x="600" y="568" font-size="23">Optimized with the policy</text>
  <text x="600" y="599" font-size="20" fill="#3c4043">Backbone-specific integration</text>

  <path class="link" d="M986 423 H1026 V335 H1054" marker-end="url(#arrow)"/>
  <path class="link" d="M1026 423 V535 H1054" marker-end="url(#arrow)"/>
  <rect x="1070" y="228" width="466" height="185" rx="22" fill="#fff"/>
  <text x="1099" y="277" class="title">Locomotion</text>
  <text x="1099" y="315" class="body">Reinforcement learning</text>
  <text x="1099" y="361" font-size="20" fill="#5f6368">PPO · humanoid control</text>
  <g transform="translate(1438 247)" stroke="#5f6368" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-12" y="0" width="24" height="25" rx="8" stroke-width="6"/>
    <path d="M-16 41 L16 41 L13 82 L-13 82 Z" stroke-width="7"/>
    <path d="M-18 45 L-33 66 L-24 88 M18 45 L34 62 L28 87 M-10 87 L-18 115 L-33 137 L-17 137 M10 87 L23 111 L20 139 L36 139" stroke-width="9"/>
    <g fill="#4285f4" stroke="none"><circle cx="-18" cy="45" r="6"/><circle cx="18" cy="45" r="6"/><circle cx="-18" cy="115" r="6"/><circle cx="23" cy="111" r="6"/></g>
  </g>
  <rect x="1070" y="433" width="466" height="185" rx="22" fill="#fff"/>
  <text x="1099" y="482" class="title">Manipulation</text>
  <text x="1099" y="520" class="body">Imitation learning</text>
  <text x="1099" y="566" font-size="20" fill="#5f6368">Diffusion · VLA policies</text>
  <g transform="translate(1425 452)" stroke="#5f6368" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-5 121 L-5 86 L-31 59 L-9 23 L24 41 L41 81" stroke-width="13"/>
    <path d="M25 84 L25 104 M51 81 L56 100 M-24 126 H16" stroke-width="8"/>
    <g fill="#4285f4" stroke="none"><circle cx="-31" cy="59" r="8"/><circle cx="-9" cy="23" r="8"/><circle cx="24" cy="41" r="8"/></g>
    <path d="M25 121 Q41 139 57 121" fill="#d3e3fd" stroke="#4285f4" stroke-width="5"/>
  </g>
  <text x="66" y="696" font-size="24" font-weight="700">Same sensor interface. Explicit interactions. End-to-end learning.</text>
</svg>
